apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    compileSdk 34
    namespace "com.openwallet.wallet"

    defaultConfig {
        applicationId "com.newyorkcoin.openwallet"
        minSdk 27
        targetSdk 34
        versionCode 63
        versionName "v1.8.5"
        ndk {
            // ZipherX (ZCL) ships native libs only for these ABIs; the Zcash SDK also
            // targets them. minSdk 27 in 2026 makes arm64-v8a + x86_64 effectively full
            // coverage (real devices + emulators). Prevents shipping an ABI without the
            // ZipherX .so (which would crash on ZCL use).
            abiFilters 'arm64-v8a', 'x86_64'
        }
    }

    signingConfigs {
        release {
            storeFile file("../"+keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    packagingOptions {
        jniLibs {
            // libscrypt has a pure-Java fallback; excluding allows install on x86_64 emulators
            excludes += ['**/libscrypt.so']
        }
        resources {
            // Multiple JARs bundle the same files; pick first occurrence.
            pickFirsts += ['META-INF/versions/9/previous-compilation-data.bin']
        }
    }

    compileOptions {
        // Required by zcash-android-sdk (uses java.time and other Java 8+ APIs)
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            // Distinct package + label so the debug build installs SIDE-BY-SIDE with a
            // release wallet on the same device without a signature clash or data wipe.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
    }
}

repositories {
    flatDir {
        dirs 'aars'
    }
}

configurations.all {
    resolutionStrategy {
        // AndroidX brings listenablefuture:1.0 which clashes with full guava jar.
        // 32.x needed by grpc (zcash-android-sdk): Metadata calls Preconditions
        // overloads that don't exist in the legacy 16.0.1 (fatal NoSuchMethodError).
        force 'com.google.guava:guava:32.1.3-android'
        // Force consistent kotlin-stdlib version across all transitive deps
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
        // zcash-android-sdk pulls in kotlinx-coroutines; pin to a known-good version
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.3'
        force 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        // protobuf-java (full) supersedes protobuf-javalite; use a single version for both
        // protobuf-java:3.22.3 still has GeneratedMessage.alwaysUseFieldBuilders (needed by
        // our protobuf-2.5.0-generated Protos.java) and includes all lite classes (needed by
        // zcash-android-sdk compiled against protobuf-javalite:4.26.1)
        force 'com.google.protobuf:protobuf-java:3.22.3'
    }
    // Exclude the standalone listenablefuture artifact that conflicts with full guava
    exclude group: 'com.google.guava', module: 'listenablefuture'
    // protobuf-java is a strict superset of protobuf-javalite; exclude lite to avoid
    // duplicate com.google.protobuf.* classes at dex time
    exclude group: 'com.google.protobuf', module: 'protobuf-javalite'
}

dependencies {
    implementation project(':core')
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.fragment:fragment:1.6.2'
    implementation 'androidx.loader:loader:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.cursoradapter:cursoradapter:1.0.0'
    implementation 'com.google.guava:guava:32.1.3-android'
    implementation 'com.google.code.findbugs:jsr305:2.0.1'
    implementation 'com.madgag.spongycastle:core:1.51.0.0'
    implementation 'com.google.protobuf:protobuf-java:3.22.3'
    implementation 'com.google.zxing:core:3.1.0'
    implementation 'ch.acra:acra:4.8.5'
    implementation 'com.jakewharton:butterknife:7.0.1'
    annotationProcessor 'com.jakewharton:butterknife:7.0.1'
    implementation 'org.slf4j:slf4j-api:1.7.36'
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    implementation 'androidx.biometric:biometric:1.1.0'
    // error-prone annotations: Tink references these at compile-time; include so R8 can resolve them (they'll be shrunk out)
    implementation 'com.google.errorprone:error_prone_annotations:2.23.0'

    // ---- Zcash SDK (lightwalletd gRPC sync, shielded + transparent) ----
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    implementation 'cash.z.ecc.android:zcash-android-sdk:2.2.7'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    // JNA runtime for the ZipherX (ZCL) UniFFI-generated Kotlin bindings (uniffi.zipherx)
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}

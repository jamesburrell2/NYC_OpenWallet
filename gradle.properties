# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# To improve gradle performance, add the following to your ~/.gradle/gradle.properties file
#
#   org.gradle.daemon=true
#   org.gradle.parallel=true
#   org.gradle.configureondemand=true
#   org.gradle.jvmargs=-Xms512m -Xmx2048m -XX:MaxPermSize=512m

android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
#

# ButterKnife 7 requires final R fields. AGP 8.x makes them non-final by default.
# This restores the pre-AGP-8 behavior so @Bind(R.id.xxx) annotations compile.
android.nonFinalResIds=false
